<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Report repairs at Meadow House, track their progress and see what was done." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Meadow House Repairs</title>
    <script>
      // pick the theme before anything paints, so dark mode doesn't flash white.
      // a saved choice wins, otherwise follow the system setting
      try {
        var saved = localStorage.getItem('meadow-house-theme')
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
